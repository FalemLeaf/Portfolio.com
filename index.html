<!DOCTYPE html>
<!-- This is the main page of the IFRAME -->
<html lang="en">
<head>
    <link rel="stylesheet" href="fonts.css">
    <meta charset="UTF-8">
    <title>JF's Portfolio</title>

    <style>
        body {
            overflow: hidden;
            background-color: #0F0F0F;

            color: #EEEEEE;
            margin: 0;
            font-family: Mono;
            
        }
        .ContHeader { /* i've added a header here -just edit */
            position: fixed;
            top: 0;
            z-index: 1;
            width: 100%;
            display: flex;
            margin-top:0px;
            color: #EEEEEE;
            font-family: Playfair;
            font-size: 12px;
            height: 20px;
            justify-content: center;
            padding: 20px;
            background-color: #212121ea;
            border-bottom: 1.5px solid #2b2b2b;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            h1{
                align-self: center;
                font-weight: 30;
            }
        }
        /* Main container */
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
            
            .profile{
                display: flex;
                margin-bottom: 40px;
                align-items: center;
                .pfpBorder{
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    width: 150px;
                    margin-right: 20px;
                    border-radius: 100%;
                    border: 1.8px solid #434343;
                    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
                    .pfp{
                        width: 100%;
                        height: 100%;
                    }
                    
                }
            }
        }
        /* Left column - Navigation */
        .menu {
            
            margin-top: 0px;
            position: Fixed;
            top: 0;
            width: 18%;
            height: 100%;
            background-color: #181818c4;
            padding: 20px;
            padding-top: 80px;
            border-right: 1.5px solid #2b2b2b;

        }
        .menu:hover{
            background-color: #181818e7;
            transition: opacity 0.1s linear;
        }
        .menu h2 {
            color: #b9b9b9;
            font-size: 18px;
        }
        .menu a {
            display: block;
            color: #bbb4a5;
            text-decoration: none;
            padding: 5px;
            margin-bottom: 10px;
            background-color: #2B2A2A;
            border-radius: 5px;
            border: 1px solid #434343;
            box-shadow: 0px 4px 2px rgba(0, 0, 0, 0.1);
        }
        .menu a:hover {
            background-color: #ffd0d0;
            color: #2B2A2A;
            border: 1px solid #a1a1a1;
            font-weight: bold;
            
        }
        /* Right column - Content */
        .content {
            
            width: 100%;
            height: 100%;
            

        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
    </style>
</head>

<body>
    <div class="ContHeader">  <!-- header area  here -->
        <h1> JF's Portfolio.</h1>
    </div>
    <div class="container">

        <!-- LEFT COLUMN -->
        <div class="menu">
            <div class="profile">
                <div class="pfpBorder"><img class="pfp" src="Assets/Profile.png"></div>
                <h2>John Francis B. Montano</h2>
            </div>

            <a href="home.html" target="contentFrame">Home</a>
            <a href="autobiography.html" target="contentFrame">About My Self</a>
            <a href="gallery.html" target="contentFrame">Gallery</a>
            <a href="contact.html" target="contentFrame">Contact</a>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="content">
            <iframe
                src="gallery.html"
                name="contentFrame"
                title="Page Content">
            </iframe>
            
            
        </div>
        

    </div>

</body>
</html>
