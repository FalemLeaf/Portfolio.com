    @font-face{
        font-family: 'Mono';
        src: url('Assets/Fonts/Jetbrain.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    @font-face{
        font-family: 'Playfair';
        src: url('Assets/Fonts/Playfair.ttf') format('truetype');

        font-display: swap;
    }
    body {
        background-color: #0F0F0F;
        margin: 0px;

    .Header {
        background-image: url("./Assets/Home_BG.jpg");
        background-size: 100%;
        background-repeat: no-repeat;
        display: flex;
        background-color: #0F0F0F;
        color: #ebcdcd;
        height: 100vh;
        
        
        .HeaderText{
            margin-top: 15%;

            text-align: left;
            font-weight: 50;
            h1{
                margin: 5px;
                font-size: 48px;
                font-family: Playfair;
                font-weight: 50;
                line-height: 1.1;
                
            }
            .details{
                display: flex;
                a{
                    margin-left: 30px;
                    text-decoration: underline;
                    text-decoration: none;
                    font-family: mono;
                    color: white;

                }
                a:hover{
                    color: red;

                }
            }
            p{
                margin: 5px;
                margin-left: 30px;
                font-size: 16px;
                font-family: Mono;
                font-weight: 20;
                line-height: 1.1;
                text-align: justify;
            }
        }
    }
    .Footer{
        height: 100%;
        width: 100%;
        background-color: #554b4127;
        padding-bottom: 50px;
        padding-top: 10px;

        .contFoot{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 150px;
            width: 100%;
            border-top: 1px solid #3b3b3b;
            border-bottom: 1px solid #3b3b3b;
            box-shadow: 0px 0px 10px #4e443159;
            background-color: #1b1b1b8e;

            .Spacer{
                width: 20%;
            }
            .Details{
                color: #ebcdcd;
                width: 30%;
                margin-right: 50px;
                h2{
                    font-family: Playfair;
                    margin-bottom: 5px;
                    font-weight: 60;
                }
                p{
                    font-family: Mono;
                    margin-top: 0px;
                    font-size: 12px;
                    text-align: justify;
                    opacity: 0.8;
                }

            }
            .Pages{
                width: 30%;
                display: flex;
                flex-direction: column;
                border-left: 2px solid #5f5f5f;
                padding-left: 20px;
                align-content: center;

                a{
                    margin-bottom: 5px;
                    font-family: Mono;
                    color: #a8a8a8;
                    text-decoration: none;

                }
                a:hover{
                    margin-bottom: 5px;
                    font-family: Mono;
                    color: white;
                    text-decoration: none;
                }
            }
        }
